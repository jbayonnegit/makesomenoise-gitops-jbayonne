apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-media
  labels:
    app: nginx-media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-media
  template:
    metadata:
      labels:
        app: nginx-media
    spec:
      containers:
      - name: nginx-media
        image: nginx:1.30.3-alpine
        ports:
        - containerPort: 8080
