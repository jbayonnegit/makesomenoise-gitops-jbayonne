apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image:  postgres:18-alpine
        ports:
        - containerPort: 5432
        envFrom:
          - configMapRef:
              name: db-secret-credentials
        volumeMounts:
          - mountPath: /var/lib/postgres/data
            name: db-data

      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-persistent-volume-claim
