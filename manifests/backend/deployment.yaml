apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: jbayonne/42-makesomenoise:back-latest
        env:
          - name: POSTGRES_URL
            valueFrom:
              secretKeyRef: 
                name: back-secret
                key: POSTGRES_URL
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef: 
                name: back-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: back-secret
                key: POSTGRES_PASSWORD
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: back-secret
                key: JWT_SECRET
          - name: MEDIA_ROOT
            valueFrom:
              secretKeyRef:
                name: back-secret
                key: MEDIA_ROOT
        ports:
        - containerPort: 8080
