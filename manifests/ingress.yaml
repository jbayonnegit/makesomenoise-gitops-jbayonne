apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: makesomenoise-ingress
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
    - host: makesomenoise.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: makesomenoise.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
    - host: makesomenoise.com
      http:
        paths:
          - path: /studio/
            pathType: Prefix
            backend:
              service:
                name: studio
                port:
                  number: 80